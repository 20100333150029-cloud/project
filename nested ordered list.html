<html>
	<head>
		<title>Nested ordered list</title>
	</head>
	<body>
		<h2>nested ordered list</h2>
		<ol>
			<li><h3>fruits </h3></li>
				<ul>
					<li>Apple</li>
					<li>orange</li>
					<li>Banana</li>
					<li>peaches</li>
				</ul>
            <li><h3>vegetables</h3></li>
                <ul>			
				   <li>Potato</li>
				   <li>Tomato</li>
				   <li>Chilli</li>
				</ul>
		</ol>
	</body>
</html>
